<!doctype html>
<html lang="ro">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>HTCMX Airsoft Admin</title>
		<meta
			name="description"
			content="Panou de administrare HTCMX Airsoft. Gestionează evenimentele, magazinul și rezervările platformei HTCMX."
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0A1A0A" />
				<meta name="mobile-web-app-capable" content="yes" />
				<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/img/htcmx-logo.jpg" />
		<link rel="apple-touch-icon" href="/img/htcmx-logo.jpg" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="HTCMX Airsoft Admin" />
		<meta property="og:description" content="Platformă tactică pentru gestionarea evenimentelor de airsoft și magazinului HTCMX." />
		<meta property="og:image" content="/img/htcmx-logo.jpg" />

		<link rel="preconnect" href="https://fonts.gstatic.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Titlu implicit — fiecare pagina il suprascrie prin <svelte:head><title> (vezi
		     +page.svelte), dar acesta ramane ca fallback daca vreodata o ruta noua uita sa-l
		     seteze. -->
		<title>HTCMX Airsoft — Admin Panel</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
